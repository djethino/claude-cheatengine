version: 2
updates:
  # Bundled into dist/ (rebuilt by the build workflow on Dependabot PRs)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Node types must match the oldest supported runtime (engines.node >= 22.13), not the latest
      # Node, or code could use APIs that do not exist on users' machines. Bump with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # MCP SDK v1 generates tool schemas from zod 3; move to zod 4 together with MCP SDK v2.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
