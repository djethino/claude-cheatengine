# Claude Code runs the committed dist/ as is (no build, no install scripts on users' machines),
# so it must always match the sources and package-lock.json.
#
# - Every push / PR: tests (Windows: they use real named pipes) and fail if dist/ is not the
#   build of src/ + package-lock.json.
# - Dependabot PRs: a dependency bump changes the lockfile only, so rebuild and commit dist/ to
#   the PR branch.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist/ is up to date
        shell: bash
        run: |
          git add --intent-to-add dist
          git diff --exit-code --stat -- dist || { echo "::error::dist/ is out of date: run 'npm run build' and commit it"; exit 1; }
      - run: npm test

  dependabot-rebuild:
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Commit rebuilt dist/
        shell: bash
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "Nothing to rebuild"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: rebuild dist/ for ${{ github.head_ref }}"
          git push
